<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com tabelas:</title>
    <style>
        table{
            width: 400px;
            height: 400px;

        }
        
        td{
            border: 1px solid black;
            border-collapse: collapse;
        }


        .b1{
            text-align: center;
        }

        .b2{
            vertical-align: top;
        }

    </style>
</head>
<body>
    <h1>Minhas tabelas:</h1>
    <table>
        <tr class="b1">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="b2">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        
    </table>
    
</body>
</html>
