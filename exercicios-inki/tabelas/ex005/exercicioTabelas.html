<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Tabelas:</title>
    <style>
        td{
            border: 1px solid black;

        }

        table{
            width: 400px;
            border-collapse: collapse;
        }

        .color1{
            background-color: aqua;
        }


    </style>
</head>
<body>
    <table>
        <tr class="color1">
            <td>a</td>
            <td>b</td>
            <td>c</td>
        </tr>
        <tr>
            <td>a</td>
            <td class="color1">b</td>
            <td>c</td>
        </tr>
        <tr>
            <td>a</td>
            <td>b</td>
            <td>c</td>
        </tr>
    </table>
</body>
</html>
