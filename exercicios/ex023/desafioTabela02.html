<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio com Tabelas:</title>
    <style>
         body{
        font-family: Arial, Helvetica, sans-serif;
    }

    table{
        border-collapse: collapse;
        width: 300px;
    }

    td{
        border: 1px solid black;
        padding: 12px;
        text-align: center;
    }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="3">a</td>
            
            <td rowspan="3">b</td>
        </tr>
         <tr>
            <td rowspan="3">c</td>
            <td>d</td>
            <td>e</td>
            <td>f</td>
        </tr>
         <tr>
            <td>g</td>
            <td>h</td>
            <td>i</td>
            <td>j</td>
        </tr>
         <tr>
            <td>l</td>
            <td>m</td>
            
            <td colspan="3">n</td>
        </tr>
    </table>
</body>
</html>
